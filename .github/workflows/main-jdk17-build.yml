name: main jdk17 build

# Tache 3 : validation du workflow Semgrep

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ main, tache3-semgrep, tache3-semgrep-test ]
    paths-ignore:
      - 'docs/**'

jobs:

  semgrep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install semgrep==1.182.1

      - name: Verify Semgrep installation
        run: semgrep --version

      # Tâche 3 : ajout humoristique dans le pipeline CI.
      - name: Rickroll dans le CI
        shell: bash
        run: |
          echo "Surprise ! Vous avez été rickrollé !"
          echo "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
          echo "::notice title=Rickroll::Une surprise vous attend dans le résumé du job."
          echo "### 🎁 Surprise dans le CI" >> "$GITHUB_STEP_SUMMARY"
          echo "[Découvrir la surprise](https://www.youtube.com/watch?v=dQw4w9WgXcQ)" >> "$GITHUB_STEP_SUMMARY"

      - name: Scan for new vulnerabilities
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Baseline commit not found"
            exit 1
          fi

          mapfile -d '' java_dirs < <(find . -type d -path '*/src/main/java' -print0)

          if [ "${#java_dirs[@]}" -eq 0 ]; then
            echo "::error::No Java source directories found"
            exit 1
          fi

          semgrep scan --config auto --baseline-commit "$BASE_SHA" --error "${java_dirs[@]}"

  build:
    needs: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Install external tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: Build with Maven
        run: mvn clean apache-rat:check test install javadoc:aggregate -Pci -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Run E2E Tests
        run: mvn -pl tika-e2e-tests -am clean verify -Pe2e -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
